<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
        display: flex;
        height: 100vh;
        background-color: #f4f4f4;
        position: relative;
        background: 
        url('/images/bg.png') no-repeat center center/cover; /* Background Image */
        background-blend-mode: overlay; /* Blend gradient with the image */
        color: #FF8C0F; /* Set all text to orange */
        }


        .logo {
            position: absolute;
            top: 20px;
            left: 65px;
            width: 200px;
        }

        .left-container {
            margin-left: 45px;
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 50px;
        }

        .title {
            margin-top: 150px;
            font-size: 35px;
            font-weight: bold;
            color: white;
        }

        .tagline {
            margin-top: 40px;
            font-size: 25px;
        }

        .login-container {
            margin-top: 50px;
            position: relative;
        }

        .login-btn {
            padding: 10px 20px;
            background-color: #ffffff; /* Yellow Button */
            color: black; /* Black text for contrast */
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
            font-weight: bold;
        }

        .login-btn:hover {
            background-color: #FF8C0F; /* Darker shade of orange */
        }

        .dropdown {
            display: none;
            position: absolute;
            top: 40px;
            left: 0;
            background: #ffffff;
            border: 1px solid #000000;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
            width: 180px;
        }

        .dropdown a {
            display: block;
            padding: 10px;
            text-decoration: none;
            color: black; /* Keep links black for visibility */
            border-bottom: 1px solid #000000;
        }

        .dropdown a:last-child {
            border-bottom: none;
        }

        .dropdown a:hover {
            background-color: #FF8C0F;
        }

        .right-container {
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Add a yellow glow behind the image */
        .image-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-wrapper::before {
            content: "";
            position: absolute;
            width: 300px; /* Slightly larger than the image */
            height: 500px; /* Adjusted size */
            background: rgba(102, 102, 102, 0.3); /* Soft yellow glow */
            border-radius: 20px;
            filter: blur(20px); /* Adds a soft glow effect */
        }

        .right-container img {
            width: 350px; /* Increased size */
            height: auto;
            position: relative;
            z-index: 2; /* Keeps the image above the glow */
        }
    </style>
</head>
<body>
    <img src="/images/rfidlogo.png" alt="Logo" class="logo">
    <div class="left-container">
        <div class="title">Smart Transit</div>
        <div class="tagline">"Unlock the Future of Transit with <br>RFID Technology."</div>
        
        <div class="login-container">
            <button class="login-btn" onclick="toggleDropdown()">Login</button>
            <div class="dropdown" id="dropdown">
                <a href="admin.html">Admin</a>
                <a href="terminal_operator.html">Terminal Operator</a>
                <a href="checkpoint_operator.html">Checkpoint Operator</a>
            </div>
        </div>
    </div>

    <div class="right-container">
        <div class="image-wrapper">
            <img src="/images/cp.png" alt="Phone Image">
        </div>
    </div>

    <script>
        function toggleDropdown() {
            var dropdown = document.getElementById("dropdown");
            dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
        }

        document.addEventListener("click", function(event) {
            var dropdown = document.getElementById("dropdown");
            var loginBtn = document.querySelector(".login-btn");

            if (!loginBtn.contains(event.target) && !dropdown.contains(event.target)) {
                dropdown.style.display = "none";
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(126deg, rgba(57, 255, 20, 0.7) 9%, rgba(255, 0, 255, 0.7) 95%),
                url('bor5.jpg') 
                no-repeat center center/cover;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            position: relative;
            gap: 20px;
        }

        .logo {
            width: 150px; /* Adjust as needed */
        }

        .title {
            font-size: 3em;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }

        .description {
            font-size: 1.2em;
            max-width: 600px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }

        .login-container {
            position: relative;
            display: inline-block;
        }

        .login-btn {
            padding: 10px 20px;
            font-size: 1.2em;
            background: #ff5733;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #c0392b;
        }

        /* Dropdown Menu */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border-radius: 5px;
            overflow: hidden;
            min-width: 200px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
        }

        .dropdown-menu a {
            display: block;
            padding: 10px;
            color: white;
            text-decoration: none;
            text-align: center;
            transition: 0.3s;
            cursor: pointer;
        }

        .dropdown-menu a:hover {
            background: #ff5733;
        }

        /* Popup Panel */
        .popup-panel {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            background: white;
            color: black;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            z-index: 10;
        }

        .popup-panel h2 {
            margin-bottom: 15px;
        }

        .popup-panel input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .popup-panel .login-submit {
            width: 100%;
            padding: 10px;
            background: #ff5733;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .popup-panel .login-submit:hover {
            background: #c0392b;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: red;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 50%;
        }

        /* Dark Background Overlay */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 9;
        }

    </style>
</head>
<body>

    <img src="lgo.png" alt="Logo" class="logo"> <!-- Replace with actual logo -->

    <div class="title">My Project</div>

    <div class="description">
        Welcome to our project! This is a short description of what our project is about.
    </div>

    <!-- Login Button with Dropdown -->
    <div class="login-container">
        <button class="login-btn" onclick="toggleDropdown()">Login</button>
        <div class="dropdown-menu" id="dropdownMenu">
            <a onclick="openLoginPanel('Admin')">Admin</a>
            <a onclick="openLoginPanel('Terminal Operator')">Terminal Operator</a>
            <a onclick="openLoginPanel('Checkpoint Operator')">Checkpoint Operator</a>
        </div>
    </div>

    <!-- Popup Login Panel -->
    <div class="overlay" id="overlay"></div>
    <div class="popup-panel" id="popupPanel">
        <button class="close-btn" onclick="closeLoginPanel()">×</button>
        <h2 id="loginTitle">Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button class="login-submit">Login</button>
    </div>

    <script>
        function toggleDropdown() {
            var menu = document.getElementById("dropdownMenu");
            menu.style.display = menu.style.display === "block" ? "none" : "block";
        }

        function openLoginPanel(role) {
            document.getElementById("loginTitle").innerText = "Login as " + role;
            document.getElementById("popupPanel").style.display = "block";
            document.getElementById("overlay").style.display = "block";
            document.getElementById("dropdownMenu").style.display = "none"; // Hide dropdown
        }

        function closeLoginPanel() {
            document.getElementById("popupPanel").style.display = "none";
            document.getElementById("overlay").style.display = "none";
        }

        // Close dropdown when clicking outside
        document.addEventListener("click", function(event) {
            var dropdown = document.getElementById("dropdownMenu");
            var button = document.querySelector(".login-btn");
            if (!button.contains(event.target) && !dropdown.contains(event.target)) {
                dropdown.style.display = "none";
            }
        });

    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wavy Background</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background: white;
        }

        .wave-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, #4CAF50, #A8E063);
            clip-path: path("M100% 0, 0 0, 0 50%, 20% 55%, 40% 45%, 60% 60%, 80% 40%, 100% 50%, 100% 0");
        }

        .content {
            position: relative;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        h1 {
            font-size: 2.5rem;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="wave-container"></div>

    <div class="content">
        <h1>Wavy Background</h1>
    </div>

</body>
</html>

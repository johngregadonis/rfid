<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Load History</title>
    <link rel="stylesheet" href="load_history.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container1">
        <div class="sidebar">
            <div class="logo">
              <img src="images/lgo.png" alt="Logo">
            </div>
            <ul class="menu">
              <li class="menu-item">North Bound</li>
              <li class="menu-item">South Bound</li>
              <li class="menu-item">Offenders</li>
              <li class="menu-item">Register Vehicle</li>
              <li class="menu-item">Reload Balance</li>
              <li class="menu-item active">Load History</li>
              
            </ul>
          </div>

         
     
    <div class="container">

        <h1>Load History</h1>

        <div class="search-bar">
            <input type="text" id="dateSearch" placeholder="Search by date (DD/MM/YYYY)" />
        </div>
        

        <table id="loadHistoryTable" >
            <thead>
                <tr>
                    <th>Body Number</th>
                    <th>Amount</th>
                    <th>Transaction Date</th>
                    <th>Remarks</th>
                </tr>
            </thead>
            <tbody>
                <!-- Rows will be dynamically inserted here -->
            </tbody>
        </table>

        <div class="no-history">No load history available.</div>
    </div>
</div>
    <script src="load_history.js"></script>
    
</body>
</html>

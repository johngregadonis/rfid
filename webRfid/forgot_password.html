<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
         * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
        body {
            height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
      background: 
      linear-gradient(126deg, rgba(34, 34, 34, 0.7) 9%, rgba(43, 42, 42, 0.7) 100%), 
        url('images/bor5.jpg'); /* Replace with your background image path */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
        }
        .forgot-password-container {
            width: 400px;
      max-width: 90%;
      background-color: rgba(255, 255, 255, 0.8); /* White with slight transparency */
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
      text-align: center;
        }
        .forgot-password-container h2 {
            margin-bottom: 15px;
            color: #333;
        }
        .input-box label{
            margin-bottom: 55px;
            color: #333;
        }
        .input-box {
            margin-bottom: 15px;
        }
        .input-box input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .button {
            margin-top: 10px;
        }
        .button button {
            width: 100%;
            padding: 10px;
            background: #000000;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        .button button:hover {
            background: #F7971D;
            color: #000000;
        }
        .message {
            margin-top: 10px;
            color: green;
        }
        .error {
            margin-top: 10px;
            color: red;
        }
    </style>
</head>
<body>

    <div class="forgot-password-container">
        <h2>Forgot Password</h2>
        <form id="forgotPasswordForm">
            <div class="input-box">
                <label for="email">Enter a valid email for OTP verification</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="button">
                <button type="submit">Send OTP</button>
            </div>
            <div id="responseMessage" class="message"></div>
        </form>
    </div>

    <script>

        let backendUrl = ''; // Global variable to store the backend URL
        
        // Fetch the backend URL when the page loads
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/get-backend-url');
                const data = await response.json();
                backendUrl = data.backendUrl;
                console.log("Backend URL Loaded:", backendUrl);
        
                // Call functions that depend on backendUrl after it's set
                
                fetchProfile();
            } catch (error) {
                console.error('Error fetching backend URL:', error);
            }
        });
        
                document.getElementById("forgotPasswordForm").addEventListener("submit", async function(event) {
                    event.preventDefault();
            
                    const email = document.getElementById("email").value;
                    const responseMessage = document.getElementById("responseMessage");
            
                    try {
                        const response = await fetch(`${backendUrl}/forgot-password`, {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({ email })
                        });
            
                        const result = await response.json();
                        
                        if (response.ok) {
                            responseMessage.textContent = result.message;
                            responseMessage.className = "message";
                            
                            // Store email in session storage to auto-fill in otp.html
                            sessionStorage.setItem("resetEmail", email);
            
                            // Redirect to OTP page
                            setTimeout(() => {
                                window.location.href = "otp.html";
                            }); // Redirect after 2 seconds
                        } else {
                            responseMessage.textContent = result.error;
                            responseMessage.className = "error";
                        }
                    } catch (error) {
                        responseMessage.textContent = "Something went wrong!";
                        responseMessage.className = "error";
                    }
                });
            </script>
    

</body>
</html>

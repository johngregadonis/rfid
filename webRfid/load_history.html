<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Load History</title>
    <link rel="stylesheet" href="load_history.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    
</head>
<body>

    <div class="container1">
        <div class="sidebar">
            <div class="logo">
              <img src="images/lgo.png" alt="Logo">
            </div>
            <ul class="menu">
                <li class="menu-item">Registered Tricycles</li>
                <li class="menu-item">Register Operator</li>
                <li class="menu-item active">Load Transaction</li>
                <li class="menu-item">Penalty Transaction</li>
                <li class="menu-item ">Detected Tricycles</li>
            </ul>
          </div>

          <div class="admin-header">
      
            <span class="admin-text">Terminal Administrator</span>
            
            <i class="fas fa-user-circle profile-icon"></i>
          </div>
     
          <div class="table-container">
            <div class="table-wrapper">
       <div class="header-container">
        <h1>Load Transaction</h1>
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="dateSearch" placeholder="Search by date (DD/MM/YYYY)" />
        </div>
    </div>

        <table class="styled-table" id="loadHistoryTable" >
            <thead>
                <tr>
                    <th>Body Number</th>
                    <th>Amount</th>
                    <th>Transaction Date</th>
                    <th>Remarks</th>
                </tr>
            </thead>
            <tbody>
                <!-- Rows will be dynamically inserted here -->
            </tbody>
        </table>

        <div class="no-history">No load history available.</div>
    </div>
</div>
</div>
    <script src="load_history.js"></script>
    
</body>
</html>

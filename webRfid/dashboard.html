<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homepage</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="logo">
        <img src="images/lgo.png" alt="Logo">
      </div>
      <ul class="menu">
        <li class="menu-item active">Registered Vehicles</li>
        <li class="menu-item">Offenders</li>
        <li class="menu-item">Register Vehicle</li>
        <li class="menu-item">Reload Balance</li>
        <li class="menu-item">Detected Vehicle</li>
        
      </ul>
    </div>

    <div class="header-container">
      <h1>Registered Vehicles</h1>
      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Search Body Number">
        
      </div>
    </div>

    <table class="styled-table">
      <thead>
        <tr>
          <th>Body Number</th>
          
          <th>UID</th>
          <th>Balance</th>
          

        </tr>
      </thead>
      <tbody id="vehicle-operators-list">
        
        <!-- Vehicle operator data will be inserted here -->
      </tbody>
    </table>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>

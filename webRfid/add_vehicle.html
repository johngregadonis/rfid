<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Vehicle</title>
  <link rel="stylesheet" href="add_vehicle.css">
</head>
<body>
  
  <div class="containers">
    <div class="sidebar">
      <div class="logo">
        <img src="images/lgo.png" alt="Logo">
      </div>
      <ul class="menu">
        <li class="menu-item">Terminal Exits</li>
        <li class="menu-item active">Register Tricycle</li>
        <li class="menu-item">Reload Balance</li>
        <li class="menu-item">Offenders</li>
     
      </ul>
    </div>

    <div class="container">
      <div class="title">Vehicle Operator Registration</div>
      <div class="content">
        <form id="vehicleForm" action="/register" method="POST">
          <div class="user-details">
            <div class="input-box">
              <span class="details">Full Name</span>
              <input type="text" name="name" placeholder="Enter your name" required>
            </div>
            <div class="input-box">
              <span class="details">Email</span>
              <input type="text" id="email" name="email" placeholder="Enter your email" required>
              <small id="email-error" style="color: red; display: none;">Invalid email address.</small>
            </div>
            
            
            <div class="input-box">
              <span class="details">Phone Number</span>
              <div style="display: flex; align-items: center;">
                <select id="country-code" name="countryCode" style="width: 70px; margin-right: 5px;">
                  <option value="+63" selected>+63</option>
                </select>
                <input
                  type="text"
                  id="phone-number"
                  name="contact"
                  placeholder="Enter your number"
                  maxlength="10"
                  required
                />
              </div>
              <small id="phone-error" style="color: red; display: none;">Invalid phone number.</small>
            </div>

            <div class="input-box">
              <span class="details">Body Number</span>
              <input type="text" id="bodyNumber" name="bodyNumber" placeholder="Enter your body number" required>
              <small class="error-message"></small>
            </div>

            <div class="input-box">
              <label for="city">Select City/Municipality:</label>
              <select id="city" class="dropdown" name="address">
                <option value="">Select a city...</option>
                <option value="BoronganCity">Borongan City</option>
                <option value="Maydolong">Maydolong</option> 
                <option value="SanJulian">San Julian</option>
              </select>
            </div>

            

            <div class="input-box">
              <label for="barangay">Select Barangay:</label>
              <select id="barangay" class="dropdown" name="barangay">
                <option value="">Select a barangay...</option>
              </select>
            </div>

            <div class="input-box">
              <span class="details">Password</span>
              <input type="password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="input-box">
              <span class="details">Confirm Password</span>
              <input type="password" name="confirmPassword" placeholder="Confirm your password" required>
            </div>

            <div class="input-box">
              <span class="details">UID (Unique Identifier)</span>
              <input type="text" id="uid" name="uid" placeholder="Enter UID" required>
              <small class="error-message"></small>
            </div>

            <div class="input-box">
              <span class="details">Load Balance Amount</span>
              <input type="text" id="balance" name="balance" placeholder="Enter Load Balance Amount (₱)" required>
              <small class="error-message"></small>
            </div>
          </div>

          <div class="button">
            <input type="submit" value="Register">
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="notification-box" class="notification-overlay" style="display: none;">
    <div class="notification-content">
      <span id="notification-message"></span>
      <button id="close-notification">Close</button>
    </div>
  </div>

  <script src="add_vehicle.js"></script>
</body>
</html>

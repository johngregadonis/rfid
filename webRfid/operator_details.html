<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operator Details</title>
  <link rel="stylesheet" href="operator.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="sidebar" id="sidebar">
      <a class="back-arrow" onclick="goBack()">
        <i class="fas fa-arrow-left"></i>
      </a>
      <div class="op-list">
        <p><strong>Body Number:</strong> <span id="body-number"></span></p>
        <p><strong>UID:</strong> <span id="uid"></span></p>
        
      </div>
    </div>

    <div class="table-container">
      <div class="table-wrapper">
    <!-- Unified Table -->
    <table class="styled-table">
      <thead>
        <tr>
          <th colspan="2">Terminal</th> <!-- Detection Details -->
          <th colspan="2">Checkpoint</th> <!-- Balance Logs -->
          <th rowspan="2">Balance</th>      
        </tr>
        <tr>
          <th>Date Departure</th>
          <th>Time Departure</th>
          <th>Date Arrival</th>
          <th>Time Arrival</th>
        </tr>
      </thead>
      
      <tbody id="vehicle-operators-list">
        <!-- Data from both functions will be inserted here -->
      </tbody>
    </table>
  </div>
</div>
</div>

  <script src="operator.js"></script>
</body>
</html>

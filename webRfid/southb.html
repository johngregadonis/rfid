<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northbound</title>
  <link rel="stylesheet" href="southb.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="logo">
        <img src="images/lgo.png" alt="Logo">
      </div>
      <ul class="menu">
        
        <li class="menu-item active">North Bound</li>
        <li class="menu-item">Detected Tricycles</li>
      </ul>
    </div>

    <div class="admin-header">
      
      <span class="admin-text">North Bound Operator</span>
      
      <i class="fas fa-user-circle profile-icon" id="profileIcon"></i>
    </div>
    
  
    <div class="table-container">
      <div class="table-wrapper">
        
    <div class="header-container">
      <h1>North Bound</h1>
      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Search Body Number">
        
      </div>
    </div>

    <table class="styled-table">
      <thead>
        <tr>
          <th>Body Number</th>
          
          <th>UID</th>
          <th>Balance</th>
          

        </tr>
      </thead>
      <tbody id="vehicle-operators-list">
        <!-- Vehicle operator data will be inserted here -->
      </tbody>
    </table>
  </div>
</div>

</div>
<!-- Overlay (for closing sidebar when clicking outside) -->
<div class="overlays" id="overlays"></div>

<!-- Right Sidebar -->
<div class="right-sidebar" id="right-sidebar">
    <span class="close-btn" id="closeBtn">&times;</span>
    
    <!-- Profile Icon Inside Sidebar -->
    <div class="profile-container">
        <i class="fas fa-user-circle profile-icon-large"></i>
        <p>Loading...</p>
    </div>

    <div class="account">
      <!-- Change Password (Dropdown Trigger) -->
      <p id="toggleChangePassword"><i class="fas fa-key"></i> Change Password</p>

      <!-- Change Password Form (Initially Hidden) -->
      <div class="change-password-form" id="changePasswordForm">
        <input type="password" id="currentPassword" placeholder="Current Password">
        <input type="password" id="newPassword" placeholder="New Password">
        <input type="password" id="confirmPassword" placeholder="Confirm Password">
        <button id="changePasswordBtn">Change Password</button>
    </div>

      <!-- Logout Button (Moves down when form appears) -->
      <p id="logoutOption"><i class="fas fa-sign-out-alt"></i> Logout</p>
  </div>
</div>

  </div>
  <div id="notification-box" class="notification-overlay" style="display: none;">
    <div class="notification-content">
      <span id="notification-message"></span>
      <button id="close-notification">Close</button>
    </div>
  </div>

  <!-- Notification Box for Logout Confirmation -->
<div id="notifications-box" class="notifications-overlay" style="display: none;">
  <div class="notifications-content">
      <span id="notifications-message"></span>
      <button id="confirm-yes">Yes</button>
      <button id="confirm-no">No</button>
  </div>
</div>
  <script src="southb.js"></script>
</body>
</html>

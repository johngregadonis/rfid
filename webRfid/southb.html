<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northbound</title>
  <link rel="stylesheet" href="southb.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="logo">
        <img src="images/lgo.png" alt="Logo">
      </div>
      <ul class="menu">
        
        <li class="menu-item active">North Bound</li>
        <li class="menu-item">Detected Tricycles</li>
      </ul>
    </div>

    <div class="admin-header">
      
      <span class="admin-text">Terminal Operator</span>
      
      <i class="fas fa-user-circle profile-icon"></i>
    </div>
    
  
  
    <div class="table-container">
      <div class="table-wrapper">
        
    <div class="header-container">
      <h1>North Bound</h1>
      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Search Body Number">
        
      </div>
    </div>

    <table class="styled-table">
      <thead>
        <tr>
          <th>Body Number</th>
          
          <th>UID</th>
          <th>Balance</th>
          

        </tr>
      </thead>
      <tbody id="vehicle-operators-list">
        <!-- Vehicle operator data will be inserted here -->
      </tbody>
    </table>
  </div>

</div>
  </div>
  <script src="southb.js"></script>
</body>
</html>

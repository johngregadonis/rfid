<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offenders Details</title>
  <link rel="stylesheet" href="offenders_details.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <a class="back-arrow" onclick="goBack()">
      <i class="fas fa-arrow-left"></i>
    </a>

    <div class="content-container">
      <div class="op-list">
        
        <p><strong>Body Number:</strong> <span id="body-number"></span></p>
        <p><strong>UID:</strong> <span id="uid"></span></p>
        <p><strong>Balance:</strong> <span id="balance"></span></p>
      </div>

      <div class="table-container">
        <div class="table-wrapper">
          <table class="styled-table">
            <thead>
              <tr>
                <th>Date Arrival <br>(at checkpoint)</th>
                <th>Time Arrival <br>(at checkpoint)</th>
                <th>Balance</th>
              </tr>
            </thead>
            <tbody id="vehicle-operators-list">
              <!-- Vehicle operator data will be inserted here -->
            </tbody>
          </table>
        </div>
      </div>

      <div class="penalty-container">
        <div class="penalty-section">
          <ul>
            <li>Fine: <span id="penalty">50.00</span></li>
            <li>Unpaid Ticket: <span id="unpaid-ticket"></span></li>
            <li>Initial Load: <span id="initial-load">50.00</span></li>
          </ul>
          <hr>
          <p><strong>Amount To Be Paid:</strong> <span id="total-amount"></span></p>
        </div>
        <button class="pay-fine-button" onclick="openModal()">Pay Fine</button>
      </div>
      
    </div>
  </div>

<!-- Overlay for blur effect -->
<div id="modal-overlay" class="modal-overlay"></div>

<!-- Modal for adding balance -->
<div id="pay-fine-modal" class="modal">
  <div class="modal-content">
    <h2>Pay Fine</h2>
    <label for="balanceInput">Amount (₱): </label>
    <input type="number" class="amount" id="balanceInput" min="1" step="0.01" placeholder="Enter amount" readonly>
    <input type="hidden" id="bodyNumberInput">
    <br><br>
    <div class="button-container">
      <button onclick="addBalanceToDB()">Pay Now</button>
      <button onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<div id="notification-box" class="notification-overlay" style="display: none;">
  <div class="notification-content">
    <span id="notification-message"></span>
    <button id="close-notification">Close</button>
  </div>
</div>

  <script src="offenders_details.js"></script>
</body>
</html>

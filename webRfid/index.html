<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RFID Tag Balance</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      margin: 20px;
    }
    h1 {
      color: #333;
    }
    ul {
      list-style-type: none;
      padding: 0;
    }
    li {
      margin: 10px 0;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
  </style>
  <script>
    async function fetchUIDs() {
      try {
        const response = await fetch('http://192.168.1.8:5000/get-rfid-logs');
        if (!response.ok) {
          throw new Error('Failed to fetch RFID logs');
        }
        const data = await response.json();

        const list = document.getElementById('uid-list');
        list.innerHTML = '';

        data.forEach(log => {
          const li = document.createElement('li');
          li.innerHTML = `
            <strong>UID:</strong> ${log.uid}<br>
            <strong>Balance:</strong> ${log.balance}<br>
            <strong>Time:</strong> ${new Date(log.timestamp).toLocaleString()}
          `;
          list.appendChild(li);
        });
      } catch (error) {
        console.error('Error fetching RFID logs:', error);
      }
    }

    async function simulateRFID(uid) {
      try {
        const response = await fetch('http://192.168.1.8:5000/rfid', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uid }),
        });

        if (!response.ok) {
          alert(await response.text());
        } else {
          console.log(`Simulated RFID detection for UID: ${uid}`);
        }
      } catch (error) {
        console.error('Error simulating RFID detection:', error);
      }
    }

    // Automatically refresh logs every second
    setInterval(fetchUIDs, 1000);

    // Example of triggering an RFID detection for testing
    setTimeout(() => simulateRFID('12345678'), 2000); // Replace with actual UID
  </script>
</head>
<body>
  <h1>RFID Tag Balance Tracker</h1>
  <p>This page displays the current balance for each detected RFID tag. Balances will update dynamically as tags are detected.</p>
  <ul id="uid-list"></ul>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Operator Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="flex bg-gray-100 h-screen">

    <!-- Sidebar -->
    <aside class="w-64 bg-black text-white flex flex-col p-4">
        <div class="flex items-center justify-center mb-6">
            <div class="text-center">
                <div class="text-2xl font-bold text-yellow-500">SMART TRANSIT</div>
            </div>
        </div>

        <nav class="flex flex-col space-y-4">
            <a href="#" class="bg-white text-black p-3 rounded-lg">Registered Vehicle</a>
            <a href="#" class="text-yellow-500 hover:text-yellow-300">Registered Terminal Operator</a>
            <a href="#" class="text-yellow-500 hover:text-yellow-300">Load History</a>
            <a href="#" class="text-yellow-500 hover:text-yellow-300">Fine Payment History</a>
            <a href="#" class="text-yellow-500 hover:text-yellow-300">Detected Vehicle</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8">
        <h1 class="text-xl font-bold text-center">TERMINAL OPERATOR</h1>

        <!-- Stats Cards -->
        <div class="grid grid-cols-4 gap-6 mt-6">
            <div class="bg-white shadow-lg p-4 rounded-lg text-center">
                <h2 class="font-bold">Total Vehicle’s Detected</h2>
                <p class="text-3xl font-bold mt-2">🚍 <span id="totalVehicles">0</span></p>
            </div>
            <div class="bg-white shadow-lg p-4 rounded-lg text-center">
                <h2 class="font-bold">Total Income</h2>
                <p class="text-3xl font-bold mt-2">₱ <span id="totalIncome">0</span></p>
            </div>
            <div class="bg-white shadow-lg p-4 rounded-lg text-center">
                <h2 class="font-bold">Total Penalty Fees</h2>
                <p class="text-3xl font-bold mt-2">₱ <span id="totalPenalty">0</span></p>
            </div>
            <div class="bg-white shadow-lg p-4 rounded-lg text-center">
                <h2 class="font-bold">Total Reload</h2>
                <p class="text-3xl font-bold mt-2">₱ <span id="totalReload">0</span></p>
            </div>
        </div>

        <!-- Charts & Table Side by Side -->
        <div class="flex justify-between mt-8 gap-6">
            
            <!-- Bar Chart Section -->
            <div class="bg-white shadow-lg rounded-lg p-6 w-2/3">
                <h2 class="text-lg font-bold text-center mb-4">PENALTY FINES CHART</h2>
                <canvas id="barChart"></canvas>
            </div>

            <!-- Penalty Fines Table -->
            <div class="bg-white shadow-lg rounded-lg p-6 w-1/3">
                <h2 class="text-lg font-bold text-center mb-4">PENALTY FINES</h2>
                <table class="w-full border">
                    <thead>
                        <tr class="bg-gray-300">
                            <th class="border p-2">Body Number</th>
                            <th class="border p-2">Reload</th>
                        </tr>
                    </thead>
                    <tbody id="penaltyTable">
                        <!-- Data will be inserted dynamically -->
                    </tbody>
                    <tfoot>
                        <tr class="bg-gray-300">
                            <td class="border p-2 text-right font-bold">Total Reload:</td>
                            <td class="border p-2 text-center font-bold">₱ <span id="tableTotalReload">0</span></td>
                        </tr>
                    </tfoot>
                </table>
            </div>

        </div>

    </main>

    <script>
        async function fetchData() {
            try {
                const response = await fetch('http://localhost:5000/data'); // Change this to your API endpoint
                const data = await response.json();

                // Update Stat Boxes
                document.getElementById('totalVehicles').innerText = data.totalVehicles;
                document.getElementById('totalIncome').innerText = data.totalIncome;
                document.getElementById('totalPenalty').innerText = data.totalPenalty;
                document.getElementById('totalReload').innerText = data.totalReload;

                // Update Table
                let tableHTML = "";
                let totalReload = 0;
                data.penaltyFines.forEach((fine) => {
                    tableHTML += `<tr>
                                    <td class="border p-2 text-center">${fine.bodyNumber}</td>
                                    <td class="border p-2 text-center">₱ ${fine.reload}</td>
                                  </tr>`;
                    totalReload += fine.reload;
                });
                document.getElementById("penaltyTable").innerHTML = tableHTML;
                document.getElementById("tableTotalReload").innerText = totalReload;

                // Update Chart
                const ctx = document.getElementById('barChart').getContext('2d');
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
                        datasets: [
                            { label: "Vehicle", data: data.chart.vehicle, backgroundColor: "red" },
                            { label: "Income", data: data.chart.income, backgroundColor: "gold" },
                            { label: "Penalty", data: data.chart.penalty, backgroundColor: "teal" },
                            { label: "Reload", data: data.chart.reload, backgroundColor: "purple" }
                        ]
                    }
                });

            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        fetchData();
    </script>

</body>
</html>
